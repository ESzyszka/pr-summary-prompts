# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Dependency Updates PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 📦 Summary Format
    - **Updated Dependencies**: Which packages were upgraded and to what versions
    - **Security Improvements**: Vulnerabilities fixed by the updates
    - **Breaking Changes**: Any API changes that required code modifications
    - **New Features**: Additional functionality available from updates
    - **Compatibility**: Node.js, browser, or framework version requirements
    
    ## 🎯 Focus Areas
    - Major vs minor vs patch version updates
    - Security vulnerability fixes (CVEs)
    - Performance improvements from updates
    - Deprecated feature removals
    - New dependency additions
    
    ## 📊 Output Style
    Group by update type using tables to organize dependency information:

    ### 📦 Dependency Updates Table
    | Package | Old Version | New Version | Update Type | Breaking |
    |---------|-------------|-------------|-------------|----------|
    | express | 4.17.1 | 4.18.2 | Security | No |
    | lodash | 4.17.19 | 4.17.21 | Security | No |
    | react | 17.0.2 | 18.2.0 | Major | Yes |
    | typescript | 4.5.0 | 5.0.0 | Major | Yes |

    ### 🔒 Security Fixes Table
    | CVE | Severity | Package | Description | Fixed In |
    |-----|----------|---------|-------------|-----------|
    | CVE-2023-1234 | High | express | Path traversal | 4.18.2 |
    | CVE-2023-5678 | Medium | lodash | Prototype pollution | 4.17.21 |

    ### 🎆 New Features Table
    | Package | Feature | Benefit |
    |---------|---------|----------|
    | React 18 | Concurrent features | Better performance |
    | TypeScript 5 | Decorators support | Modern syntax |

    Highlight breaking changes prominently and explain migration requirements.
