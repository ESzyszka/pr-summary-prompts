# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Refactoring PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## ♻️ Summary Format
    - **Refactoring Goals**: What improvements were made and why
    - **Code Structure Changes**: How the architecture was improved
    - **Design Patterns**: New patterns introduced or improved
    - **Performance Impact**: Any performance improvements achieved
    - **Maintainability**: How this makes the code easier to maintain
    
    ## 🔧 Focus Areas
    - Function/class extraction and simplification
    - Code duplication removal
    - Improved naming conventions
    - Better separation of concerns
    - Enhanced error handling patterns
    
    ## 📊 Output Style
    Emphasize the before/after benefits using tables to clearly show improvements:

    ### ♻️ Refactoring Impact Table
    | Metric | Before | After | Improvement |
    |--------|--------|-------|-------------|
    | Cyclomatic Complexity | 15 | 8 | 47% reduction |
    | Lines of Code | 500 | 350 | 30% reduction |
    | Code Duplication | 25% | 5% | 80% reduction |
    | Test Coverage | 60% | 85% | 25% increase |

    ### 🏗️ Architecture Changes Table
    | Component | Old Pattern | New Pattern | Benefit |
    |-----------|-------------|-------------|---------|
    | Data Access | Direct DB calls | Repository pattern | Better testability |
    | Error Handling | Try-catch everywhere | Centralized handler | Consistent UX |
    | Validation | Inline checks | Validator classes | Reusable logic |

    Highlight any breaking changes and explain how this refactoring prepares the codebase for future features.
