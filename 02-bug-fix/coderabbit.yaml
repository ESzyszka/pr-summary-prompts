# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Bug Fix PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 🐛 Summary Format
    - **Issue Description**: What bug was being fixed
    - **Root Cause**: What was causing the problem
    - **Solution Approach**: How the fix addresses the issue
    - **Files Changed**: Which files were modified and why
    - **Testing**: How the fix was validated
    
    ## 🔍 Focus Areas
    - Error handling improvements
    - Edge cases addressed
    - Data validation fixes
    - Performance issues resolved
    - Security vulnerabilities patched
    
    ## 📊 Output Style
    Start with the bug impact, explain the technical solution clearly, and include tables to organize the information:

    ### 🐛 Bug Analysis Table
    | Aspect | Before | After | Impact |
    |--------|--------|-------|--------|
    | Behavior | User login fails silently | Shows clear error message | High |
    | Performance | 5s load time | 1s load time | Medium |
    | Data | Inconsistent validation | Unified validation rules | High |

    ### 🔧 Files Changed Table
    | File | Change Type | Description | Lines Changed |
    |------|-------------|-------------|---------------|
    | auth.js | Bug Fix | Fixed null pointer exception | 15 |
    | validation.js | Enhancement | Added input sanitization | 25 |
    | user.test.js | Test | Added edge case coverage | 40 |

    Highlight any preventive measures added to avoid similar issues in the future.
