---
name: "Dependency Updates PR Summary"
description: "Specialized configuration for analyzing dependency update pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "dependencies"
  priority: "medium"
  categories:
    - "security-updates"
    - "feature-updates"
    - "maintenance-updates"
    - "breaking-changes"
    - "compatibility"

# Summary Configuration
summary:
  template: "dependency_updates"
  max_length: 550
  focus_areas:
    - updated_dependencies
    - security_improvements
    - breaking_changes
    - compatibility

  structure:
    header:
      title: "📦 Dependency Updates"
      emoji: "📦"
      style: "update-focused"

    sections:
      - name: "Updated Dependencies"
        icon: "📋"
        required: true
        format: "table"
        content:
          - "Which packages were upgraded and to what versions"
          - "Major vs minor vs patch version updates"
          - "New dependencies added"
          - "Dependencies removed or replaced"

      - name: "Security Improvements"
        icon: "🔒"
        required: false
        format: "alert"
        style: "info"
        content:
          - "Vulnerabilities fixed by the updates"
          - "CVE numbers and severity levels"
          - "Security advisories addressed"
          - "Risk mitigation achieved"

      - name: "Breaking Changes"
        icon: "⚠️"
        required: false
        format: "alert"
        style: "warning"
        content:
          - "Any API changes that required code modifications"
          - "Deprecated features removed"
          - "Configuration changes needed"
          - "Migration steps required"

      - name: "New Features Available"
        icon: "✨"
        required: false
        format: "bullet_points"
        content:
          - "Additional functionality from updates"
          - "Performance improvements gained"
          - "New capabilities enabled"
          - "Developer experience enhancements"

      - name: "Compatibility Requirements"
        icon: "🔗"
        required: true
        format: "bullet_points"
        content:
          - "Node.js, Python, or runtime version requirements"
          - "Browser compatibility changes"
          - "Operating system requirements"
          - "Peer dependency impacts"

      - name: "Testing & Validation"
        icon: "✅"
        required: true
        format: "checklist"
        content:
          - "Automated tests pass with updates"
          - "Manual testing completed"
          - "Performance regression checks"
          - "Integration testing verified"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on dependency updates and their impact. Pay special attention to:

    1. **Update Classification**: Categorize updates as security, feature, or maintenance
    2. **Breaking Changes**: Identify any changes that affect existing functionality
    3. **Security Impact**: Highlight security vulnerabilities fixed
    4. **Compatibility**: Note any runtime or environment requirement changes
    5. **Risk Assessment**: Evaluate potential risks from the updates

    Group updates by type and explain the benefits while highlighting any migration requirements.

  focus_patterns:
    - pattern: "package\\.json|requirements\\.txt|Cargo\\.toml|pom\\.xml|Gemfile|go\\.mod"
      weight: 1.0
      description: "Dependency configuration files"

    - pattern: "npm.*update|pip.*install|cargo.*update|maven.*update|bundle.*update"
      weight: 0.9
      description: "Package manager update commands"

    - pattern: "vulnerability|cve|security.*advisory|security.*fix"
      weight: 1.0
      description: "Security-related updates"

    - pattern: "breaking.*change|major.*version|deprecated|migration"
      weight: 0.95
      description: "Breaking change indicators"

    - pattern: "patch|minor|major|semver|semantic.*version"
      weight: 0.8
      description: "Version type indicators"

    - pattern: "node.*version|python.*version|java.*version|runtime"
      weight: 0.7
      description: "Runtime version requirements"

# Update Types
update_types:
  security:
    patterns:
      - "security|vulnerability|cve|advisory"
    priority: "critical"
    description: "Security vulnerability fixes"

  major:
    patterns:
      - "major.*version|breaking.*change|\\^[0-9]+\\.[0-9]+\\.[0-9]+ -> \\^[0-9]+\\.[0-9]+\\.[0-9]+"
    priority: "high"
    description: "Major version updates with potential breaking changes"

  minor:
    patterns:
      - "minor.*version|feature.*update"
    priority: "medium"
    description: "Minor version updates with new features"

  patch:
    patterns:
      - "patch.*version|bug.*fix|hotfix"
    priority: "low"
    description: "Patch updates with bug fixes"

# Security Vulnerability Analysis
security_analysis:
  enabled: true
  severity_levels:
    critical:
      score: "9.0-10.0"
      color: "red"
      action_required: true

    high:
      score: "7.0-8.9"
      color: "orange"
      action_required: true

    medium:
      score: "4.0-6.9"
      color: "yellow"
      action_required: false

    low:
      score: "0.1-3.9"
      color: "green"
      action_required: false

  databases:
    - "npm_audit"
    - "snyk"
    - "github_security"
    - "cve_database"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/package*.json"
    - "**/yarn.lock"
    - "**/package-lock.json"
    - "**/requirements*.txt"
    - "**/Pipfile*"
    - "**/Cargo.toml"
    - "**/Cargo.lock"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/Gemfile*"
    - "**/go.mod"
    - "**/go.sum"
    - "**/*.csproj"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/target/**"
    - "**/dist/**"
    - "**/build/**"

  priority_files:
    - pattern: "**/package.json"
      weight: 1.0
    - pattern: "**/requirements.txt"
      weight: 1.0
    - pattern: "**/Cargo.toml"
      weight: 1.0
    - pattern: "**/pom.xml"
      weight: 1.0

# Breaking Change Detection
breaking_changes:
  enabled: true
  indicators:
    major_version:
      pattern: "\\^?([0-9]+)\\.[0-9]+\\.[0-9]+ -> \\^?([0-9]+)\\.[0-9]+\\.[0-9]+"
      condition: "first_number != second_number"

    deprecated_removal:
      patterns:
        - "remove.*deprecated"
        - "drop.*support"
        - "end.*of.*life"

    api_changes:
      patterns:
        - "breaking.*change"
        - "incompatible.*change"
        - "migration.*required"

# Quality Checks
quality_checks:
  security_vulnerabilities:
    enabled: true
    severity: "critical"
    auto_fix: false

  outdated_dependencies:
    enabled: true
    threshold_days: 365
    severity: "low"

  license_compatibility:
    enabled: true
    allowed_licenses:
      - "MIT"
      - "Apache-2.0"
      - "BSD-3-Clause"
      - "ISC"

  peer_dependencies:
    enabled: true
    check_conflicts: true

# Package Ecosystems
ecosystems:
  npm:
    files: ["package.json", "package-lock.json", "yarn.lock"]
    manager: "npm"
    update_strategy: "semver"

  pip:
    files: ["requirements.txt", "Pipfile", "setup.py"]
    manager: "pip"
    update_strategy: "compatible"

  cargo:
    files: ["Cargo.toml", "Cargo.lock"]
    manager: "cargo"
    update_strategy: "semver"

  maven:
    files: ["pom.xml"]
    manager: "maven"
    update_strategy: "compatible"

  bundler:
    files: ["Gemfile", "Gemfile.lock"]
    manager: "bundler"
    update_strategy: "semver"

# Output Configuration
output:
  format: "markdown"
  style: "dependency-focused"
  include_metrics: false
  include_files_changed: true
  include_version_table: true
  include_security_summary: true

  badges:
    - name: "dependencies"
      color: "blue"
      icon: "📦"
    - name: "security-fix"
      color: "red"
      icon: "🔒"
      condition: "security_updates"
    - name: "breaking-changes"
      color: "orange"
      icon: "⚠️"
      condition: "has_breaking_changes"
    - name: "maintenance"
      color: "green"
      icon: "🔧"
      condition: "maintenance_updates"

# Validation Rules
validation:
  required_sections:
    - "Updated Dependencies"
    - "Compatibility Requirements"
    - "Testing & Validation"

  minimum_description_length: 80
  require_version_info: true
  require_testing_confirmation: true

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "dependencies"
      - "maintenance"

  dependabot:
    enabled: true
    auto_merge_patch: false
    auto_merge_minor: false

  snyk:
    enabled: true
    vulnerability_monitoring: true

  renovate:
    enabled: false