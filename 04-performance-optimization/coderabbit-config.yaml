---
name: "Performance Optimization PR Summary"
description: "Specialized configuration for analyzing performance optimization pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "performance"
  priority: "high"
  categories:
    - "query-optimization"
    - "caching"
    - "memory-optimization"
    - "algorithm-improvement"
    - "resource-utilization"

# Summary Configuration
summary:
  template: "performance_optimization"
  max_length: 550
  focus_areas:
    - performance_issue
    - optimization_strategy
    - metrics_impact
    - implementation_details

  structure:
    header:
      title: "⚡ Performance Optimization"
      emoji: "⚡"
      style: "metrics-focused"

    sections:
      - name: "Performance Issue Identified"
        icon: "🎯"
        required: true
        format: "paragraph"
        content:
          - "What bottleneck was identified"
          - "Impact on user experience or system resources"
          - "How the issue was discovered or measured"

      - name: "Optimization Strategy"
        icon: "🚀"
        required: true
        format: "bullet_points"
        max_items: 4
        content:
          - "How performance was improved"
          - "Technical approach taken"
          - "Tools and techniques used"
          - "Alternative approaches considered"

      - name: "Performance Metrics"
        icon: "📊"
        required: true
        format: "metrics_table"
        content:
          - "Before/after performance measurements"
          - "Response time improvements"
          - "Memory usage changes"
          - "Throughput enhancements"
          - "Resource utilization improvements"

      - name: "Implementation Details"
        icon: "🔧"
        required: true
        format: "bullet_points"
        content:
          - "Technical changes made"
          - "Algorithms or data structures improved"
          - "Caching strategies implemented"
          - "Database or query optimizations"

      - name: "Trade-offs & Considerations"
        icon: "⚖️"
        required: false
        format: "paragraph"
        content:
          - "Any compromises or trade-offs made"
          - "Memory vs speed considerations"
          - "Complexity vs performance balance"
          - "Maintainability impact"

      - name: "Monitoring & Validation"
        icon: "📈"
        required: true
        format: "checklist"
        content:
          - "Performance testing conducted"
          - "Benchmarking results verified"
          - "Production monitoring setup"
          - "Regression testing completed"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on performance improvements. Pay special attention to:

    1. **Problem Identification**: Clearly identify the performance bottleneck being addressed
    2. **Quantifiable Impact**: Look for specific metrics showing before/after improvements
    3. **Technical Approach**: Assess the optimization strategy and implementation quality
    4. **Validation Methods**: Ensure proper testing and measurement of improvements
    5. **Side Effects**: Consider any potential negative impacts or trade-offs

    Emphasize measurable improvements with specific numbers and explain the technical rationale.

  focus_patterns:
    - pattern: "performance|optimization|optimize|faster|speed|latency|throughput"
      weight: 1.0
      description: "Performance improvement indicators"

    - pattern: "cache|caching|memoiz|redis|memcach"
      weight: 0.9
      description: "Caching implementations"

    - pattern: "query.*optim|database.*optim|sql.*optim|index|db.*performance"
      weight: 0.95
      description: "Database optimization"

    - pattern: "memory.*optim|memory.*usage|memory.*leak|garbage.*collection"
      weight: 0.9
      description: "Memory optimization"

    - pattern: "algorithm|data.*structure|complexity|O\\(|time.*complexity|space.*complexity"
      weight: 0.85
      description: "Algorithmic improvements"

    - pattern: "lazy.*load|pagination|batch|bulk|parallel|concurrent|async"
      weight: 0.8
      description: "Loading and processing optimizations"

# Performance Metrics
performance_metrics:
  response_time:
    enabled: true
    units: ["ms", "seconds"]
    thresholds:
      significant: 20  # 20% improvement
      major: 50       # 50% improvement

  throughput:
    enabled: true
    units: ["rps", "tps", "qps"]
    thresholds:
      significant: 15
      major: 40

  memory_usage:
    enabled: true
    units: ["MB", "GB", "bytes"]
    thresholds:
      significant: 10
      major: 30

  cpu_usage:
    enabled: true
    units: ["%", "cores"]
    thresholds:
      significant: 15
      major: 35

  database_metrics:
    enabled: true
    metrics:
      - "query_time"
      - "connection_pool"
      - "index_usage"
      - "scan_efficiency"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/*.{js,ts,jsx,tsx,py,java,go,rs,php,rb,c,cpp,h,sql}"
    - "**/src/**"
    - "**/lib/**"
    - "**/queries/**"
    - "**/migrations/**"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/test/**"
    - "**/spec/**"

  priority_files:
    - pattern: "**/*{service,repository,dao,query}*"
      weight: 1.0
    - pattern: "**/src/**"
      weight: 0.9
    - pattern: "**/*{cache,redis,memcach}*"
      weight: 0.8
    - pattern: "**/config/**"
      weight: 0.7

# Quality Checks
quality_checks:
  benchmark_validation:
    enabled: true
    required: true
    patterns:
      - "benchmark"
      - "performance.*test"
      - "load.*test"
      - "stress.*test"

  monitoring_setup:
    enabled: true
    patterns:
      - "monitor"
      - "metric"
      - "telemetry"
      - "observability"

  regression_prevention:
    enabled: true
    patterns:
      - "performance.*test"
      - "regression.*test"
      - "continuous.*monitoring"

# Optimization Types
optimization_types:
  database:
    patterns:
      - "index|query.*optim|sql.*tuning|database.*performance"
    metrics: ["query_time", "connection_usage", "index_efficiency"]

  caching:
    patterns:
      - "cache|caching|redis|memcach|memoiz"
    metrics: ["cache_hit_rate", "response_time", "memory_usage"]

  algorithm:
    patterns:
      - "algorithm|data.*structure|complexity|sort|search"
    metrics: ["execution_time", "memory_usage", "cpu_usage"]

  network:
    patterns:
      - "network|http|request|api.*call|latency"
    metrics: ["response_time", "bandwidth", "request_rate"]

  memory:
    patterns:
      - "memory|garbage.*collection|allocation|leak"
    metrics: ["memory_usage", "gc_time", "allocation_rate"]

  concurrency:
    patterns:
      - "parallel|concurrent|async|thread|worker"
    metrics: ["throughput", "cpu_utilization", "response_time"]

# Output Configuration
output:
  format: "markdown"
  style: "metrics-heavy"
  include_metrics: true
  include_files_changed: true
  include_complexity_score: false
  include_performance_charts: true

  badges:
    - name: "performance"
      color: "orange"
      icon: "⚡"
    - name: "major-improvement"
      color: "green"
      icon: "🚀"
      condition: "major_performance_gain"
    - name: "database-optimized"
      color: "blue"
      icon: "🗄️"
      condition: "database_optimization"
    - name: "cached"
      color: "purple"
      icon: "💾"
      condition: "caching_implemented"

# Validation Rules
validation:
  required_sections:
    - "Performance Issue Identified"
    - "Optimization Strategy"
    - "Performance Metrics"
    - "Monitoring & Validation"

  minimum_description_length: 120
  require_benchmark_data: true
  require_before_after_metrics: true

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "performance"
      - "optimization"

  grafana:
    enabled: true
    dashboard_auto_update: true

  newrelic:
    enabled: true
    alert_thresholds: true

  datadog:
    enabled: true
    metric_tracking: true