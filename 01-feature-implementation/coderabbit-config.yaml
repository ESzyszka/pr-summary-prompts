---
name: "Feature Implementation PR Summary"
description: "Specialized configuration for analyzing feature implementation pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "feature"
  priority: "high"
  categories:
    - "new-functionality"
    - "business-logic"
    - "integration"

# Summary Configuration
summary:
  template: "feature_implementation"
  max_length: 500
  focus_areas:
    - feature_overview
    - business_impact
    - integration_points
    - testing_coverage

  structure:
    header:
      title: "🚀 New Feature Implementation"
      emoji: "🚀"
      style: "prominent"

    sections:
      - name: "Feature Overview"
        icon: "📋"
        required: true
        format: "bullet_points"
        max_items: 3
        content:
          - "Brief description of the new functionality"
          - "Key capabilities and user benefits"
          - "Integration with existing features"

      - name: "Key Components"
        icon: "🔧"
        required: true
        format: "list"
        content:
          - "Main files/modules added or modified"
          - "New API endpoints or interfaces"
          - "Database schema changes"
          - "Frontend components and interactions"

      - name: "Business Impact"
        icon: "📈"
        required: true
        format: "paragraph"
        content:
          - "How this feature benefits users or the product"
          - "Expected usage patterns and adoption"
          - "Competitive advantages gained"

      - name: "Integration Points"
        icon: "🔗"
        required: false
        format: "bullet_points"
        content:
          - "How it connects with existing systems"
          - "Dependencies on other components"
          - "Potential impact on other features"

      - name: "Testing Coverage"
        icon: "🧪"
        required: true
        format: "checklist"
        content:
          - "Unit tests for new functionality"
          - "Integration tests for system interactions"
          - "End-to-end tests for user workflows"
          - "Performance tests if applicable"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on new feature implementation. Pay special attention to:

    1. **Feature Scope**: Identify the main functionality being added and its purpose
    2. **User Value**: Explain how this feature benefits end users or stakeholders
    3. **Technical Implementation**: Highlight key technical decisions and architecture
    4. **Integration**: Describe how it fits with existing codebase and systems
    5. **Quality Assurance**: Assess testing coverage and quality measures

    Provide a clear, business-focused summary that both technical and non-technical stakeholders can understand.

  focus_patterns:
    - pattern: "new.*(?:function|feature|capability|endpoint|component|service|module)"
      weight: 1.0
      description: "New functionality indicators"

    - pattern: "(?:api|endpoint|route|controller).*(?:add|create|new)"
      weight: 0.9
      description: "API additions"

    - pattern: "(?:test|spec|coverage).*(?:add|new|implement)"
      weight: 0.8
      description: "Testing additions"

    - pattern: "(?:database|schema|migration|model).*(?:add|create|new)"
      weight: 0.9
      description: "Data layer changes"

    - pattern: "(?:ui|component|page|view|screen).*(?:add|create|new)"
      weight: 0.8
      description: "UI/UX additions"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/*.{js,ts,jsx,tsx,py,java,go,rs,php,rb}"
    - "**/package.json"
    - "**/requirements.txt"
    - "**/Cargo.toml"
    - "**/pom.xml"
    - "**/*.sql"
    - "**/*.yaml"
    - "**/*.yml"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.js"
    - "**/*.log"

  priority_files:
    - pattern: "**/src/**"
      weight: 1.0
    - pattern: "**/test/**"
      weight: 0.8
    - pattern: "**/api/**"
      weight: 0.9
    - pattern: "**/components/**"
      weight: 0.7

# Quality Checks
quality_checks:
  breaking_changes:
    enabled: true
    severity: "high"
    patterns:
      - "BREAKING CHANGE:"
      - "breaking:"
      - "deprecat"

  security:
    enabled: true
    patterns:
      - "auth"
      - "permission"
      - "credential"
      - "token"
      - "password"

  performance:
    enabled: true
    patterns:
      - "optimization"
      - "cache"
      - "performance"
      - "memory"
      - "cpu"

# Output Configuration
output:
  format: "markdown"
  style: "professional"
  include_metrics: true
  include_files_changed: true
  include_complexity_score: false

  badges:
    - name: "feature"
      color: "green"
      icon: "🚀"
    - name: "tested"
      color: "blue"
      icon: "✅"
      condition: "has_tests"
    - name: "breaking"
      color: "red"
      icon: "⚠️"
      condition: "has_breaking_changes"

# Validation Rules
validation:
  required_sections:
    - "Feature Overview"
    - "Key Components"
    - "Business Impact"
    - "Testing Coverage"

  minimum_description_length: 100
  require_test_files: true
  require_documentation_updates: false

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "feature"
      - "enhancement"

  jira:
    enabled: false

  slack:
    enabled: false