# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
reviews:
  # Linked Issues Verification Summary Template
  high_level_summary_instructions: >-
    # Linked Issues Verification PR Summary

    ## 🔗 Issue Resolution Analysis
    - **Linked Issues**: Connected GitHub issues, requirements fulfillment
    - **Acceptance Criteria**: User story completion, feature requirements met
    - **Bug Resolution**: Root cause analysis, fix validation, regression testing
    - **Feature Implementation**: Scope adherence, edge case coverage
    - **Requirements Traceability**: Business logic alignment, stakeholder approval

    ### 🎯 Issue Resolution Table
    | Issue | Type | Status | Requirements Met | Acceptance Criteria |
    |-------|------|--------|------------------|-------------------|
    | #123 | Bug | ✅ Resolved | All | 5/5 criteria met |
    | #456 | Feature | ✅ Resolved | All | 8/8 criteria met |
    | #789 | Enhancement | ⚠️ Partial | 4/5 | 3/4 criteria met |

    ### 🧪 Validation Testing Table
    | Issue | Test Coverage | Manual Testing | Automated Testing | Status |
    |-------|---------------|---------------|-------------------|--------|
    | #123 | 95% | ✅ Passed | ✅ Passed | Ready |
    | #456 | 88% | ✅ Passed | ✅ Passed | Ready |
    | #789 | 75% | ⚠️ Partial | ✅ Passed | Needs review |

    Focus on complete issue resolution and thorough validation.

  auto_review:
    enabled: true

chat:
  auto_reply: true