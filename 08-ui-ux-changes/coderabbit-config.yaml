---
name: "UI/UX Changes PR Summary"
description: "Specialized configuration for analyzing user interface and experience pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "ui_ux"
  priority: "medium"
  categories:
    - "visual-design"
    - "user-experience"
    - "accessibility"
    - "responsive-design"
    - "interaction-design"

# Summary Configuration
summary:
  template: "ui_ux_changes"
  max_length: 550
  focus_areas:
    - visual_changes
    - user_experience
    - accessibility
    - responsive_design

  structure:
    header:
      title: "🎨 UI/UX Changes"
      emoji: "🎨"
      style: "design-focused"

    sections:
      - name: "Visual Changes"
        icon: "👀"
        required: true
        format: "bullet_points"
        content:
          - "What UI elements were modified or added"
          - "Design system updates and consistency improvements"
          - "Color scheme, typography, or layout changes"
          - "Component styling and visual hierarchy"

      - name: "User Experience Improvements"
        icon: "✨"
        required: true
        format: "bullet_points"
        content:
          - "How interactions and workflows were improved"
          - "Navigation and usability enhancements"
          - "Loading states and feedback mechanisms"
          - "Error handling and user guidance"

      - name: "Accessibility Enhancements"
        icon: "♿"
        required: false
        format: "checklist"
        content:
          - "Screen reader compatibility improvements"
          - "Keyboard navigation enhancements"
          - "Color contrast and readability improvements"
          - "ARIA labels and semantic markup"
          - "Focus management and indicators"

      - name: "Responsive Design"
        icon: "📱"
        required: false
        format: "bullet_points"
        content:
          - "Mobile and tablet experience improvements"
          - "Breakpoint and layout adaptations"
          - "Touch interaction optimizations"
          - "Cross-device consistency"

      - name: "Interactive Elements"
        icon: "🖱️"
        required: false
        format: "bullet_points"
        content:
          - "New components and design patterns"
          - "Animation and transition improvements"
          - "Form enhancements and validation UX"
          - "Button states and interactive feedback"

      - name: "Performance Impact"
        icon: "⚡"
        required: false
        format: "paragraph"
        content:
          - "UI rendering performance improvements"
          - "Asset optimization and bundle size"
          - "Loading time enhancements"
          - "Animation performance considerations"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on user interface and experience improvements. Pay special attention to:

    1. **Visual Impact**: Describe what users will see and how the interface has changed
    2. **Usability**: Explain how user interactions and workflows are improved
    3. **Accessibility**: Highlight improvements for users with disabilities
    4. **Consistency**: Note design system adherence and pattern consistency
    5. **Performance**: Consider any performance implications of UI changes

    Focus on user benefits and describe changes in terms that both technical and design stakeholders can understand.

  focus_patterns:
    - pattern: "ui|ux|interface|component|style|design|layout"
      weight: 1.0
      description: "UI/UX related indicators"

    - pattern: "css|scss|sass|styled|emotion|chakra|material"
      weight: 0.9
      description: "Styling and design system"

    - pattern: "responsive|mobile|tablet|breakpoint|media.*query"
      weight: 0.8
      description: "Responsive design"

    - pattern: "accessibility|a11y|aria|screen.*reader|wcag"
      weight: 0.9
      description: "Accessibility improvements"

    - pattern: "animation|transition|motion|framer|lottie"
      weight: 0.7
      description: "Animations and interactions"

    - pattern: "react|vue|angular|svelte|component|jsx|tsx"
      weight: 0.8
      description: "Frontend frameworks"

# UI Component Types
component_types:
  layout:
    patterns:
      - "layout|grid|flex|container|wrapper|header|footer|sidebar"
    description: "Layout and structural components"
    weight: 0.9

  navigation:
    patterns:
      - "nav|menu|breadcrumb|tab|pagination|router|link"
    description: "Navigation components"
    weight: 0.8

  forms:
    patterns:
      - "form|input|select|checkbox|radio|button|submit|validation"
    description: "Form and input components"
    weight: 0.8

  feedback:
    patterns:
      - "modal|dialog|toast|notification|alert|spinner|loader"
    description: "User feedback components"
    weight: 0.7

  data_display:
    patterns:
      - "table|list|card|chart|graph|dashboard|display"
    description: "Data presentation components"
    weight: 0.6

# Design System Compliance
design_system:
  enabled: true
  tokens:
    - "colors"
    - "typography"
    - "spacing"
    - "shadows"
    - "borders"
    - "breakpoints"

  components:
    - "buttons"
    - "inputs"
    - "cards"
    - "modals"
    - "navigation"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/*.{css,scss,sass,less,styl}"
    - "**/*.{js,ts,jsx,tsx,vue,svelte}"
    - "**/components/**"
    - "**/styles/**"
    - "**/assets/**"
    - "**/public/**"
    - "**/*.styled.*"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.css"
    - "**/*.min.js"

  priority_files:
    - pattern: "**/components/**"
      weight: 1.0
    - pattern: "**/styles/**"
      weight: 0.9
    - pattern: "**/assets/**"
      weight: 0.7
    - pattern: "**/*.css"
      weight: 0.8

# Quality Checks
quality_checks:
  accessibility:
    enabled: true
    severity: "high"
    checks:
      - "aria_labels"
      - "semantic_markup"
      - "color_contrast"
      - "keyboard_navigation"

  responsive_design:
    enabled: true
    breakpoints:
      - "mobile: 320px"
      - "tablet: 768px"
      - "desktop: 1024px"
      - "large: 1200px"

  performance:
    enabled: true
    metrics:
      - "bundle_size"
      - "render_time"
      - "layout_shift"
      - "interaction_delay"

  browser_compatibility:
    enabled: true
    targets:
      - "Chrome >= 90"
      - "Firefox >= 88"
      - "Safari >= 14"
      - "Edge >= 90"

# Accessibility Standards
accessibility_standards:
  wcag_2_1:
    enabled: true
    level: "AA"
    guidelines:
      - "perceivable"
      - "operable"
      - "understandable"
      - "robust"

  aria_compliance:
    enabled: true
    required_attributes:
      - "aria-label"
      - "aria-describedby"
      - "aria-expanded"
      - "aria-hidden"

# Visual Regression Testing
visual_testing:
  enabled: false
  tools:
    - "percy"
    - "chromatic"
    - "applitools"

  screenshot_comparison: true
  diff_threshold: 0.1

# Output Configuration
output:
  format: "markdown"
  style: "visual-focused"
  include_metrics: false
  include_files_changed: true
  include_screenshots: true

  badges:
    - name: "ui-ux"
      color: "purple"
      icon: "🎨"
    - name: "accessible"
      color: "blue"
      icon: "♿"
      condition: "accessibility_improved"
    - name: "responsive"
      color: "green"
      icon: "📱"
      condition: "responsive_design"
    - name: "animated"
      color: "orange"
      icon: "✨"
      condition: "has_animations"

# Validation Rules
validation:
  required_sections:
    - "Visual Changes"
    - "User Experience Improvements"

  minimum_description_length: 100
  require_accessibility_check: false
  require_responsive_check: false

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "ui"
      - "ux"
      - "frontend"

  figma:
    enabled: false
    design_sync: true

  storybook:
    enabled: false
    component_documentation: true

  lighthouse:
    enabled: true
    performance_check: true