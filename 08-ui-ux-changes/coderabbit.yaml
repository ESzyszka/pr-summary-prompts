# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # UI/UX Changes PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 🎨 Summary Format
    - **Visual Changes**: What UI elements were modified or added
    - **User Experience**: How interactions and workflows were improved
    - **Design System**: Components, patterns, and consistency improvements
    - **Accessibility**: Improvements for users with disabilities
    - **Responsive Design**: Mobile and tablet experience enhancements
    
    ## 🎯 Focus Areas
    - New components and design patterns
    - Interactive elements and animations
    - Form improvements and validation UX
    - Navigation and information architecture
    - Performance optimizations for UI
    
    ## 📊 Output Style
    Describe visual changes clearly using tables to organize the improvements:

    ### 🎨 UI Changes Table
    | Component | Change Type | Description | User Benefit |
    |-----------|-------------|-------------|-------------|
    | Navigation | Redesign | Simplified menu structure | Easier navigation |
    | Forms | Enhancement | Inline validation | Immediate feedback |
    | Dashboard | New Feature | Widget customization | Personalized experience |
    | Buttons | Consistency | Unified design system | Better brand coherence |

    ### ♿ Accessibility Improvements Table
    | Feature | WCAG Level | Implementation | Impact |
    |---------|-----------|--------------|---------|
    | Keyboard Navigation | AA | Tab index optimization | Screen reader friendly |
    | Color Contrast | AAA | High contrast theme | Visually impaired users |
    | Alt Text | A | Image descriptions | Screen reader support |
    | Focus Indicators | AA | Visible focus rings | Keyboard users |

    Highlight any design system consistency gains achieved.
