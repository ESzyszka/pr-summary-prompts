# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # API Changes PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 🔌 Summary Format
    - **API Changes Overview**: What endpoints were added, modified, or removed
    - **Breaking Changes**: Any changes that affect existing clients
    - **New Functionality**: Additional capabilities introduced
    - **Request/Response Changes**: Schema modifications and new parameters
    - **Backward Compatibility**: How existing integrations are handled
    
    ## 🎯 Focus Areas
    - New REST endpoints or GraphQL mutations
    - Authentication and authorization changes
    - Input validation and error handling
    - Response format modifications
    - Rate limiting and pagination updates
    
    ## 📊 Output Style
    Start with breaking changes (if any), then organize information using tables:

    ### 🔌 API Changes Summary Table
    | Endpoint | Method | Change Type | Breaking | Description |
    |----------|--------|-------------|----------|-------------|
    | /users/{id} | PUT | Modified | Yes | Added required field 'email' |
    | /posts | POST | New | No | Create post functionality |
    | /login | POST | Deprecated | Yes | Use /auth/login instead |

    ### 📋 Schema Changes Table
    | Field | Old Type | New Type | Required | Migration |
    |-------|----------|----------|----------|----------|
    | user.email | - | string | Yes | Add email field |
    | post.tags | string | string[] | No | Split comma-separated |
    | auth.token | string | object | Yes | Use token.access_token |

    Include examples of request/response formats and highlight migration paths for existing clients.
