  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: true
  labeling_instructions: []
  path_filters: []
  path_instructions: []
  abort_on_close: true
  disable_cache: false

  # Accessibility (WCAG) Summary Template
  high_level_summary_instructions: >-
    # Accessibility (WCAG) Compliance PR Summary

    Analyze this pull request with a focus on web accessibility and WCAG compliance:

    ## ♿ Accessibility Impact Analysis
    - **WCAG Compliance Level**: A, AA, or AAA standards addressed
    - **Screen Reader Support**: ARIA labels, semantic HTML, keyboard navigation
    - **Visual Accessibility**: Color contrast, font sizing, visual indicators
    - **Motor Accessibility**: Keyboard navigation, focus management, click targets
    - **Cognitive Accessibility**: Clear language, consistent navigation, error handling

    ## 🎯 WCAG Compliance Assessment
    Use this table format to assess accessibility improvements:

    ### ♿ WCAG Compliance Table
    | WCAG Criterion | Level | Before | After | Compliance Status |
    |----------------|-------|--------|-------|------------------|
    | 1.4.3 Color Contrast | AA | 3.1:1 | 4.8:1 | ✅ Compliant |
    | 2.1.1 Keyboard Access | A | Partial | Full | ✅ Compliant |
    | 1.1.1 Alt Text | A | Missing | Added | ✅ Compliant |
    | 2.4.7 Focus Visible | AA | None | Ring indicator | ✅ Compliant |
    | 3.3.2 Labels/Instructions | A | Unclear | Descriptive | ✅ Compliant |

    ### 🔧 Accessibility Improvements Table
    | Component | Issue | Solution | WCAG Reference | Testing Method |
    |-----------|-------|----------|----------------|----------------|
    | Navigation | No keyboard focus | Added focus styles | 2.4.7 | Tab navigation test |
    | Images | Missing alt text | Added descriptions | 1.1.1 | Screen reader test |
    | Forms | No error messages | Added aria-live regions | 3.3.3 | NVDA/JAWS test |
    | Buttons | Low contrast | Increased to 4.5:1 | 1.4.3 | Color analyzer tool |

    ### 🛠️ Assistive Technology Support
    | Technology | Tested | Status | Notes |
    |------------|--------|--------|-------|
    | NVDA | ✅ | Pass | All content announced |
    | JAWS | ✅ | Pass | Navigation works properly |
    | VoiceOver | ✅ | Pass | iOS/macOS compatible |
    | Dragon NaturallySpeaking | ⚠️ | Partial | Voice commands limited |
    | Keyboard Only | ✅ | Pass | Full functionality available |

    Focus on inclusive design principles, assistive technology compatibility, and legal compliance requirements.

