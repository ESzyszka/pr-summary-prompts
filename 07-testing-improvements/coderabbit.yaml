# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Testing Improvements PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 🧪 Summary Format
    - **Testing Coverage**: What new tests were added or improved
    - **Test Categories**: Unit, integration, end-to-end, performance tests
    - **Quality Improvements**: Better assertions, mocking, or test structure
    - **CI/CD Integration**: Pipeline improvements and automated testing
    - **Coverage Metrics**: Coverage percentage changes and gap analysis
    
    ## 🎯 Focus Areas
    - New test suites and test cases
    - Mock and stub implementations
    - Test utilities and helpers
    - Performance and load testing
    - Accessibility and visual regression tests
    
    ## 📊 Output Style
    Highlight testing strategy improvements using tables to organize coverage data:

    ### 🧪 Coverage Metrics Table
    | Test Type | Before | After | Change | Target |
    |-----------|--------|-------|--------|---------|
    | Unit Tests | 75% | 85% | +10% | >90% |
    | Integration | 60% | 78% | +18% | >80% |
    | E2E | 45% | 65% | +20% | >70% |
    | Overall | 68% | 82% | +14% | >85% |

    ### 📝 Test Suite Changes Table
    | Component | Tests Added | Test Type | Purpose |
    |-----------|-------------|-----------|----------|
    | UserService | 15 | Unit | Edge case validation |
    | AuthFlow | 8 | Integration | Complete user journey |
    | PaymentAPI | 12 | Unit + Integration | Error handling |
    | UI Components | 20 | Visual Regression | Layout consistency |

    Explain how these tests prevent regressions and catch edge cases.
