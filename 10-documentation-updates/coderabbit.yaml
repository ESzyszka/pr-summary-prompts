# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Documentation Updates PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 📚 Summary Format
    - **Documentation Scope**: What areas of documentation were improved
    - **Content Changes**: New guides, updated instructions, or fixed information
    - **Structure Improvements**: Better organization or navigation
    - **Code Examples**: Updated or new code samples and tutorials
    - **Accessibility**: Improvements for documentation readability and accessibility
    
    ## 🎯 Focus Areas
    - API documentation updates
    - Setup and installation guides
    - Code examples and tutorials
    - Architecture and design documentation
    - Contributing guidelines and processes
    
    ## 📊 Output Style
    Highlight documentation improvements using tables to organize the changes:

    ### 📚 Documentation Changes Table
    | Document | Change Type | Description | Impact |
    |----------|-------------|-------------|--------|
    | API Reference | Updated | Added new endpoints | Complete API coverage |
    | Getting Started | New | Quick setup guide | Faster onboarding |
    | Architecture | Restructured | Better organization | Easier navigation |
    | Examples | Enhanced | More code samples | Better understanding |

    ### 👥 Developer Experience Table
    | Area | Before | After | Improvement |
    |------|--------|-------|-------------|
    | Setup Time | 45 min | 15 min | 67% faster |
    | Code Examples | 12 | 25 | 108% increase |
    | Search Results | Poor | Excellent | Better discoverability |
    | Mobile Reading | Difficult | Optimized | Responsive design |

    Explain how these changes make the project more accessible to new contributors and ensure information accuracy.
