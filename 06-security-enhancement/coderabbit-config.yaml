---
name: "Security Enhancement PR Summary"
description: "Specialized configuration for analyzing security improvement pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "security"
  priority: "critical"
  categories:
    - "vulnerability-fix"
    - "authentication"
    - "authorization"
    - "input-validation"
    - "encryption"

# Summary Configuration
summary:
  template: "security_enhancement"
  max_length: 550
  focus_areas:
    - security_issue
    - measures_implemented
    - impact_assessment
    - compliance

  structure:
    header:
      title: "🔒 Security Enhancement"
      emoji: "🔒"
      style: "security-focused"

    sections:
      - name: "Security Issue Addressed"
        icon: "🎯"
        required: true
        format: "alert"
        style: "warning"
        content:
          - "What vulnerability or risk was mitigated"
          - "Potential impact if the issue wasn't fixed"
          - "How the security gap was discovered"

      - name: "Security Measures Implemented"
        icon: "🛡️"
        required: true
        format: "bullet_points"
        content:
          - "New protections and safeguards added"
          - "Security controls strengthened"
          - "Validation and sanitization improvements"
          - "Access control enhancements"

      - name: "Technical Implementation"
        icon: "🔧"
        required: true
        format: "bullet_points"
        content:
          - "How the security fix works"
          - "Cryptographic improvements"
          - "Authentication/authorization changes"
          - "Input validation mechanisms"

      - name: "Compliance & Standards"
        icon: "📋"
        required: false
        format: "checklist"
        content:
          - "Regulatory compliance improvements"
          - "Security standard alignment"
          - "Audit requirements addressed"
          - "Best practice implementations"

      - name: "Testing & Validation"
        icon: "🧪"
        required: true
        format: "checklist"
        content:
          - "Security testing performed"
          - "Penetration testing conducted"
          - "Vulnerability scanning completed"
          - "Code security review done"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on security improvements and risk mitigation. Pay special attention to:

    1. **Risk Assessment**: Clearly identify the security risk being addressed and its potential impact
    2. **Solution Quality**: Evaluate the effectiveness and completeness of security measures
    3. **Implementation Security**: Ensure the fix doesn't introduce new vulnerabilities
    4. **Compliance Impact**: Note any regulatory or compliance improvements
    5. **User Impact**: Assess any changes to user experience due to security enhancements

    Emphasize the security benefits while noting any user-facing changes or migration requirements.

  focus_patterns:
    - pattern: "(?:security|vulnerability|exploit|attack|threat|risk|cve)"
      weight: 1.0
      description: "Security-related indicators"

    - pattern: "(?:auth|authentication|authorization|permission|access.*control)"
      weight: 0.9
      description: "Authentication and authorization"

    - pattern: "(?:encrypt|decrypt|hash|salt|crypto|cipher|tls|ssl)"
      weight: 0.95
      description: "Cryptographic implementations"

    - pattern: "(?:injection|xss|csrf|sanitiz|validat|escape|filter)"
      weight: 0.9
      description: "Input validation and attack prevention"

    - pattern: "(?:session|token|jwt|oauth|saml|mfa|2fa)"
      weight: 0.85
      description: "Session and token management"

# Security Categories
security_categories:
  authentication:
    patterns:
      - "auth|login|password|credential|multi.*factor|mfa|2fa"
    severity: "high"
    description: "Authentication mechanism improvements"

  authorization:
    patterns:
      - "authorization|permission|access.*control|role|privilege"
    severity: "high"
    description: "Access control and permission changes"

  input_validation:
    patterns:
      - "validation|sanitiz|escape|filter|injection|xss|sql.*injection"
    severity: "high"
    description: "Input validation and sanitization"

  encryption:
    patterns:
      - "encrypt|decrypt|hash|crypto|cipher|tls|ssl|certificate"
    severity: "high"
    description: "Encryption and cryptographic improvements"

  session_management:
    patterns:
      - "session|token|jwt|cookie|timeout|expir"
    severity: "medium"
    description: "Session handling and token management"

  data_protection:
    patterns:
      - "pii|gdpr|ccpa|data.*protection|privacy|sensitive.*data"
    severity: "high"
    description: "Data protection and privacy compliance"

# Vulnerability Types
vulnerability_types:
  injection:
    patterns: ["injection", "sql.*injection", "command.*injection", "ldap.*injection"]
    cwe: "CWE-89"
    severity: "critical"

  xss:
    patterns: ["xss", "cross.*site.*scripting", "script.*injection"]
    cwe: "CWE-79"
    severity: "high"

  broken_authentication:
    patterns: ["broken.*auth", "session.*fixation", "credential.*stuffing"]
    cwe: "CWE-287"
    severity: "high"

  sensitive_data:
    patterns: ["sensitive.*data", "data.*exposure", "information.*disclosure"]
    cwe: "CWE-200"
    severity: "medium"

  broken_access:
    patterns: ["broken.*access", "privilege.*escalation", "unauthorized.*access"]
    cwe: "CWE-284"
    severity: "high"

  csrf:
    patterns: ["csrf", "cross.*site.*request"]
    cwe: "CWE-352"
    severity: "medium"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/*.{js,ts,py,java,go,rs,php,rb,c,cpp,cs}"
    - "**/auth/**"
    - "**/security/**"
    - "**/middleware/**"
    - "**/config/**"
    - "**/*auth*"
    - "**/*security*"
    - "**/*crypto*"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"

  priority_files:
    - pattern: "**/auth/**"
      weight: 1.0
    - pattern: "**/security/**"
      weight: 1.0
    - pattern: "**/middleware/**"
      weight: 0.9
    - pattern: "**/*auth*"
      weight: 0.8

# Security Checks
security_checks:
  hardcoded_secrets:
    enabled: true
    severity: "critical"
    patterns:
      - "password.*=.*['\"][^'\"]{8,}['\"]"
      - "api.*key.*=.*['\"][^'\"]{10,}['\"]"
      - "secret.*=.*['\"][^'\"]{8,}['\"]"
      - "token.*=.*['\"][^'\"]{20,}['\"]"

  weak_cryptography:
    enabled: true
    severity: "high"
    patterns:
      - "md5|sha1"
      - "des|3des"
      - "rc4"

  insecure_protocols:
    enabled: true
    severity: "medium"
    patterns:
      - "http://"
      - "ftp://"
      - "telnet://"

  dangerous_functions:
    enabled: true
    severity: "high"
    patterns:
      - "eval\\("
      - "exec\\("
      - "system\\("
      - "shell_exec"

# Compliance Standards
compliance_standards:
  owasp_top_10:
    enabled: true
    categories:
      - "A01:2021-Broken Access Control"
      - "A02:2021-Cryptographic Failures"
      - "A03:2021-Injection"
      - "A04:2021-Insecure Design"
      - "A05:2021-Security Misconfiguration"

  gdpr:
    enabled: true
    requirements:
      - "data_encryption"
      - "access_controls"
      - "audit_logging"
      - "data_minimization"

  pci_dss:
    enabled: false

  hipaa:
    enabled: false

# Output Configuration
output:
  format: "markdown"
  style: "security-focused"
  include_metrics: false
  include_files_changed: true
  include_severity_assessment: true

  badges:
    - name: "security"
      color: "red"
      icon: "🔒"
    - name: "critical"
      color: "darkred"
      icon: "🚨"
      condition: "critical_security_fix"
    - name: "compliance"
      color: "blue"
      icon: "📋"
      condition: "compliance_improvement"
    - name: "tested"
      color: "green"
      icon: "✅"
      condition: "security_tested"

# Validation Rules
validation:
  required_sections:
    - "Security Issue Addressed"
    - "Security Measures Implemented"
    - "Technical Implementation"
    - "Testing & Validation"

  minimum_description_length: 100
  require_security_testing: true
  require_impact_assessment: true

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "security"
      - "vulnerability"

  sonarqube:
    enabled: true
    security_hotspots: true

  snyk:
    enabled: true
    vulnerability_scanning: true

  veracode:
    enabled: false