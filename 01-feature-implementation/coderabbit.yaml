# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Feature Implementation PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 📋 Summary Format
    - **Feature Overview**: Brief description of the new functionality
    - **Key Components**: List main files/modules added or modified
    - **Business Impact**: How this feature benefits users or the product
    - **Integration Points**: How it connects with existing systems
    - **Testing Coverage**: What tests were added/modified
    
    ## 🎯 Focus Areas
    - New API endpoints or interfaces
    - Database schema changes
    - Frontend components and user interactions
    - Configuration or environment changes
    - Dependencies added or updated
    
    ## 📊 Output Style
    Use clear sections with bullet points and emojis for readability. Include tables where appropriate to organize information clearly:

    ### 📋 Changes Summary Table
    | Component | Type | Description | Impact |
    |-----------|------|-------------|--------|
    | API | New | Added user management endpoints | High |
    | Frontend | Modified | Updated login component | Medium |
    | Database | Schema | Added user_roles table | High |

    ### 🧪 Testing Coverage Table
    | Test Type | Files Added/Modified | Coverage Area |
    |-----------|---------------------|---------------|
    | Unit | user.test.js | User model validation |
    | Integration | auth.integration.test.js | Authentication flow |
    | E2E | login.e2e.test.js | Complete user journey |

    Highlight any breaking changes or migration requirements in separate sections.
