# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    # Security Enhancement PR Summary
    
    Analyze this pull request and provide a comprehensive summary focusing on:
    
    ## 🔒 Summary Format
    - **Security Issue Addressed**: What vulnerability or risk was mitigated
    - **Security Measures Implemented**: New protections and safeguards added
    - **Impact Assessment**: Potential impact if the issue wasn't fixed
    - **Implementation Details**: How the security fix works
    - **Compliance**: Any regulatory or standard compliance improvements
    
    ## 🛡️ Focus Areas
    - Authentication and authorization improvements
    - Input validation and sanitization
    - Data encryption and secure storage
    - Access control modifications
    - Security headers and configurations
    
    ## 📊 Output Style
    Start with the security risk level and organize information using tables:

    ### 🔒 Security Risk Assessment Table
    | Vulnerability | Severity | CVSS Score | Impact | Mitigation |
    |---------------|----------|------------|--------|------------|
    | SQL Injection | High | 8.1 | Data breach | Parameterized queries |
    | XSS | Medium | 6.2 | Session hijacking | Input sanitization |
    | Weak Auth | High | 7.8 | Account takeover | 2FA implementation |

    ### 🔧 Security Enhancements Table
    | Component | Enhancement | Implementation | Compliance |
    |-----------|-------------|----------------|------------|
    | Authentication | 2FA | TOTP integration | SOC 2 |
    | Data Storage | Encryption | AES-256 | GDPR |
    | API Access | Rate limiting | Redis-based throttling | OWASP |

    Highlight any user-facing changes or migration requirements for enhanced security.
