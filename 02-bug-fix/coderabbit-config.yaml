---
name: "Bug Fix PR Summary"
description: "Specialized configuration for analyzing bug fix pull requests"
version: "1.0.0"

# PR Classification
classification:
  type: "bugfix"
  priority: "high"
  categories:
    - "error-handling"
    - "data-validation"
    - "performance-issue"
    - "memory-leak"
    - "logic-error"

# Summary Configuration
summary:
  template: "bug_fix"
  max_length: 450
  focus_areas:
    - issue_description
    - root_cause
    - solution_approach
    - impact_assessment

  structure:
    header:
      title: "🐛 Bug Fix"
      emoji: "🐛"
      style: "prominent"

    sections:
      - name: "Issue Description"
        icon: "🔍"
        required: true
        format: "paragraph"
        content:
          - "What bug was being fixed"
          - "Symptoms and user impact"
          - "When and how the issue was discovered"

      - name: "Root Cause Analysis"
        icon: "🔬"
        required: true
        format: "bullet_points"
        max_items: 3
        content:
          - "What was causing the problem"
          - "Why the issue occurred originally"
          - "Contributing factors or conditions"

      - name: "Solution Approach"
        icon: "🔧"
        required: true
        format: "bullet_points"
        content:
          - "How the fix addresses the issue"
          - "Technical changes implemented"
          - "Alternative solutions considered"

      - name: "Files Changed"
        icon: "📝"
        required: true
        format: "list"
        content:
          - "Which files were modified and why"
          - "Scope of changes made"
          - "Dependencies affected"

      - name: "Testing & Validation"
        icon: "✅"
        required: true
        format: "checklist"
        content:
          - "How the fix was validated"
          - "Regression tests added"
          - "Edge cases covered"
          - "Manual testing performed"

      - name: "Impact Assessment"
        icon: "📊"
        required: false
        format: "bullet_points"
        content:
          - "User experience improvements"
          - "System stability gains"
          - "Performance impact (if any)"

# Analysis Instructions
analysis:
  instructions: |
    Analyze this pull request focusing on bug resolution. Pay special attention to:

    1. **Problem Identification**: Clearly describe what was broken and its impact
    2. **Root Cause**: Explain the underlying cause of the issue
    3. **Solution Quality**: Assess whether the fix addresses the root cause effectively
    4. **Risk Assessment**: Identify any potential side effects or risks
    5. **Prevention**: Note any preventive measures added to avoid similar issues

    Emphasize the technical accuracy of the fix and its impact on system reliability.

  focus_patterns:
    - pattern: "fix|bug|issue|error|problem|crash|fail"
      weight: 1.0
      description: "Bug-related indicators"

    - pattern: "null.*(?:pointer|reference)|undefined|NullPointerException"
      weight: 0.9
      description: "Null pointer issues"

    - pattern: "memory.*leak|leak.*memory|OutOfMemoryError"
      weight: 1.0
      description: "Memory leak indicators"

    - pattern: "race.*condition|deadlock|concurrent|synchroniz"
      weight: 0.9
      description: "Concurrency issues"

    - pattern: "validation|sanitiz|escape|injection|xss"
      weight: 0.8
      description: "Security/validation fixes"

    - pattern: "timeout|performance|slow|optimization"
      weight: 0.7
      description: "Performance-related fixes"

# File Analysis Rules
file_analysis:
  include_patterns:
    - "**/*.{js,ts,jsx,tsx,py,java,go,rs,php,rb,c,cpp,h}"
    - "**/test/**"
    - "**/spec/**"
    - "**/*test*"
    - "**/*spec*"

  exclude_patterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.js"
    - "**/coverage/**"

  priority_files:
    - pattern: "**/src/**"
      weight: 1.0
    - pattern: "**/lib/**"
      weight: 0.9
    - pattern: "**/test/**"
      weight: 0.8
    - pattern: "**/spec/**"
      weight: 0.8

# Quality Checks
quality_checks:
  regression_risk:
    enabled: true
    severity: "medium"
    patterns:
      - "global"
      - "shared"
      - "common"
      - "util"
      - "helper"

  error_handling:
    enabled: true
    patterns:
      - "try.*catch"
      - "except"
      - "error"
      - "exception"
      - "throw"

  test_coverage:
    enabled: true
    required: true
    patterns:
      - "test"
      - "spec"
      - "mock"
      - "stub"

# Severity Classification
severity:
  critical:
    patterns:
      - "crash"
      - "data.*loss"
      - "security"
      - "corruption"
    impact: "System crashes, data loss, or security vulnerabilities"

  high:
    patterns:
      - "memory.*leak"
      - "performance.*degradation"
      - "user.*blocking"
    impact: "Significant user impact or system degradation"

  medium:
    patterns:
      - "ui.*issue"
      - "display.*problem"
      - "minor.*functionality"
    impact: "Moderate user impact or functionality issues"

  low:
    patterns:
      - "cosmetic"
      - "typo"
      - "style"
      - "formatting"
    impact: "Minor issues with minimal user impact"

# Output Configuration
output:
  format: "markdown"
  style: "technical"
  include_metrics: true
  include_files_changed: true
  include_complexity_score: true

  badges:
    - name: "bugfix"
      color: "red"
      icon: "🐛"
    - name: "critical"
      color: "darkred"
      icon: "🚨"
      condition: "severity_critical"
    - name: "tested"
      color: "green"
      icon: "✅"
      condition: "has_tests"
    - name: "hotfix"
      color: "orange"
      icon: "🔥"
      condition: "is_hotfix"

# Validation Rules
validation:
  required_sections:
    - "Issue Description"
    - "Root Cause Analysis"
    - "Solution Approach"
    - "Testing & Validation"

  minimum_description_length: 80
  require_test_files: true
  require_issue_reference: false

# Integration Settings
integrations:
  github:
    enabled: true
    label_auto_add:
      - "bug"
      - "fix"

  jira:
    enabled: true
    auto_transition: true
    status_map:
      - from: "In Progress"
        to: "Code Review"

  sentry:
    enabled: true
    auto_resolve: true