# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
reviews:
  # Reviewer Guidance Summary Template
  high_level_summary_instructions: >-
    # Reviewer Guidance PR Summary

    ## 👥 Review Focus Areas
    - **Code Quality**: Architecture, patterns, maintainability, readability
    - **Security Considerations**: Vulnerabilities, best practices, compliance
    - **Performance Impact**: Optimization opportunities, bottlenecks, scaling
    - **Testing Strategy**: Coverage, test quality, edge cases, automation
    - **Business Logic**: Requirements alignment, user experience, functionality

    ### 🔍 Review Checklist Table
    | Review Area | Priority | Complexity | Time Estimate | Reviewer Skills |
    |-------------|----------|------------|---------------|-----------------|
    | Security Review | High | Medium | 30 min | Security expertise |
    | Performance Review | Medium | High | 45 min | Performance tuning |
    | Code Architecture | High | High | 60 min | Senior developer |
    | UI/UX Review | Medium | Low | 20 min | Design knowledge |
    | Database Changes | High | Medium | 25 min | DBA/Backend expert |

    ### 📋 Specific Review Points
    | File/Component | What to Review | Why Important | Suggested Reviewer |
    |----------------|----------------|---------------|-------------------|
    | auth.service.ts | Token validation logic | Security critical | @security-team |
    | user.controller.ts | Input validation | Data integrity | @backend-lead |
    | payment.component.tsx | Error handling | User experience | @frontend-lead |
    | database/migrations/ | Schema changes | Data safety | @dba-team |

    ### ⚠️ Risk Assessment Table
    | Risk Category | Level | Mitigation | Review Required |
    |---------------|-------|------------|-----------------|
    | Breaking Changes | High | Version compatibility check | Yes |
    | Security Impact | Medium | Security audit | Yes |
    | Performance Risk | Low | Load testing | Optional |
    | Data Migration | High | Rollback plan review | Yes |

    Focus on guiding reviewers to the most critical areas and potential risks.

  auto_review:
    enabled: true

chat:
  auto_reply: true
